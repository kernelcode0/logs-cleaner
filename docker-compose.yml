version: "3.9"

services:
  cleanup-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "${VERSION:-dev}"
    image: docker-cleanup-agent:${VERSION:-latest}
    container_name: docker-cleanup-agent
    restart: unless-stopped
    user: "0:0"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:rw
      - agent-data:/data

    ports:
      - "8080:8080"

    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agent-data:
    driver: local
